<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mado</title>
<style>
  :root {
    --gap: 6px;
    --accent: #ff0033;
    --bg: #111;
    --panel: #1d1d1f;
    --text: #f2f2f2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  #bar {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px;
    background: var(--panel);
    border-bottom: 1px solid #000;
  }
  #url {
    flex: 1 1 auto;
    min-width: 0;
    height: 38px;
    padding: 0 10px;
    font-size: 16px; /* The minimum size not for zooming when focusing on mobile */
    border: 1px solid #444;
    border-radius: 8px;
    background: #000;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  #url.invalid {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,0,51,0.5);
    animation: shake .3s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .btn {
    flex: 0 0 auto;
    height: 38px;
    padding: 0 12px;
    font-size: 14px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #2c2c2e;
    color: var(--text);
    cursor: pointer;
  }
  .btn:active { background: #3a3a3c; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.icon {
    width: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn.icon svg { width: 20px; height: 20px; display: block; }
  #add.icon { font-size: 24px; line-height: 1; font-weight: 600; }
  #layoutToggle { display: flex; gap: 4px; }
  .btn.seg.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.seg.active svg { color: #fff; }

  #grid {
    flex: 1 1 auto;
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    overflow: hidden;
    grid-auto-rows: 1fr;
  }
  #grid.cols-1 { grid-template-columns: 1fr; }
  #grid.cols-2 { grid-template-columns: 1fr 1fr; }
  #grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

  #empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #555;
    padding: 24px;
  }
  #empty svg { width: 40px; height: 40px; }
  #empty .plus { font-size: 30px; line-height: 1; }

  .cell {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    min-height: 0;
  }
  .cell .player { width: 100%; height: 100%; }
  .cell .player iframe { width: 100%; height: 100%; display: block; }

  .cell .tools {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .cell .tools.show {
    opacity: 1;
    pointer-events: auto;
  }
  @media (hover: hover) {
    .cell:hover .tools {
      opacity: 1;
      pointer-events: auto;
    }
  }
  .tool {
    width: 34px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    border: none;
    border-radius: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    cursor: pointer;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  .tool:active { background: rgba(0,0,0,0.85); }
  .tool.del { background: rgba(180,0,0,0.7); }
  .tool:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>
  <div id="bar">
    <input id="url" type="text" inputmode="url" autocomplete="off"
           placeholder="YouTube URL">
    <button id="add" class="btn primary icon" aria-label="Add">＋</button>
    <div id="layoutToggle">
      <button class="btn seg icon active" data-cols="1" aria-label="1 column">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <rect x="3" y="3" width="14" height="6" rx="1"></rect>
          <rect x="3" y="11" width="14" height="6" rx="1"></rect>
        </svg>
      </button>
      <button class="btn seg icon" data-cols="2" aria-label="2 columns">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <rect x="3" y="3" width="6" height="6" rx="1"></rect>
          <rect x="11" y="3" width="6" height="6" rx="1"></rect>
          <rect x="3" y="11" width="6" height="6" rx="1"></rect>
          <rect x="11" y="11" width="6" height="6" rx="1"></rect>
        </svg>
      </button>
      <button class="btn seg icon" data-cols="3" aria-label="3 columns">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <rect x="2" y="3" width="4" height="6" rx="1"></rect>
          <rect x="8" y="3" width="4" height="6" rx="1"></rect>
          <rect x="14" y="3" width="4" height="6" rx="1"></rect>
          <rect x="2" y="11" width="4" height="6" rx="1"></rect>
          <rect x="8" y="11" width="4" height="6" rx="1"></rect>
          <rect x="14" y="11" width="4" height="6" rx="1"></rect>
        </svg>
      </button>
    </div>
  </div>
  <div id="grid" class="cols-1">
    <div id="empty" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"></path>
      </svg>
      <span class="plus">＋</span>
    </div>
  </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function () {
  "use strict";

  // windows: [{ id:number, videoId:string, player:YT.Player|null, mountId:string }]
  var windows = [];
  var cols = 1;
  var nextId = 1;
  var apiReady = false;
  var pending = [];

  var gridEl = document.getElementById("grid");
  var emptyEl = document.getElementById("empty");
  var urlEl = document.getElementById("url");

  function isId(x) { return !!x && /^[A-Za-z0-9_-]{11}$/.test(x); }

  // Support watch?v=, youtu.be/, /live/, /embed/, /shorts/, /v/, and a raw 11-digit ID
  function parseVideoId(input) {
    if (!input) return null;
    var s = input.trim();

    if (isId(s)) return s;

    var url;
    try {
      url = new URL(s);
    } catch (e) {
      return null;
    }

    var host = url.hostname.replace(/^www\./, "");

    if (host === "youtu.be") {
      var seg = url.pathname.split("/").filter(Boolean)[0];
      return isId(seg) ? seg : null;
    }

    if (host === "youtube.com" || host === "m.youtube.com" || host === "music.youtube.com") {
      var v = url.searchParams.get("v");
      if (isId(v)) return v;
      var parts = url.pathname.split("/").filter(Boolean);
      if (parts.length >= 2 &&
          (parts[0] === "live" || parts[0] === "embed" || parts[0] === "shorts" || parts[0] === "v")) {
        return isId(parts[1]) ? parts[1] : null;
      }
    }
    return null;
  }

  var invalidTimer = null;
  function flashInvalid() {
    urlEl.classList.remove("invalid");
    void urlEl.offsetWidth;
    urlEl.classList.add("invalid");
    if (invalidTimer) clearTimeout(invalidTimer);
    invalidTimer = setTimeout(function () {
      urlEl.classList.remove("invalid");
    }, 1200);
  }

  var YT_PLAYING = 1; // YT.PlayerState.PLAYING
  function createPlayer(win) {
    win.player = new YT.Player(win.mountId, {
      videoId: win.videoId,
      playerVars: {
        playsinline: 1,
        rel: 0
      },
      events: {
        onReady: function () { showTools(win); },
        onStateChange: function (e) {
          win.playing = (e.data === YT_PLAYING);
          showTools(win);
        }
      }
    });
  }

  function addWindow(videoId) {
    var id = nextId++;
    var win = {
      id: id,
      videoId: videoId,
      player: null,
      mountId: "player-" + id
    };
    windows.push(win);
    render();
    showTools(win);

    if (apiReady) {
      createPlayer(win);
    } else {
      pending.push(win);
    }
    saveState();
  }

  function removeWindow(id) {
    var idx = windows.findIndex(function (w) { return w.id === id; });
    if (idx === -1) return;
    var win = windows[idx];
    if (win.player && typeof win.player.destroy === "function") {
      win.player.destroy();
    }
    windows.splice(idx, 1);
    render();
    saveState();
  }

  function move(id, dir) {
    var idx = windows.findIndex(function (w) { return w.id === id; });
    if (idx === -1) return;
    var to = idx + dir;
    if (to < 0 || to >= windows.length) return;
    var tmp = windows[idx];
    windows[idx] = windows[to];
    windows[to] = tmp;
    render();
    saveState();
  }

  function setCols(n) {
    cols = n;
    gridEl.classList.remove("cols-1", "cols-2", "cols-3");
    gridEl.classList.add("cols-" + n);
    var segs = document.querySelectorAll(".seg");
    for (var i = 0; i < segs.length; i++) {
      segs[i].classList.toggle("active", Number(segs[i].dataset.cols) === n);
    }
    render();
    saveState();
  }

  function render() {
    emptyEl.style.display = windows.length ? "none" : "flex";

    // In order not to recreate iframe, preserve DOM of existing cells and just update CSS `order`.
    windows.forEach(function (win, i) {
      var cell = document.getElementById("cell-" + win.id);
      if (!cell) {
        cell = buildCell(win);
        gridEl.appendChild(cell);
      }
      cell.style.order = String(i);
      var left = cell.querySelector(".tool.left");
      var right = cell.querySelector(".tool.right");
      if (left) {
        left.disabled = (i === 0);
        left.textContent = (cols === 1) ? "↑" : "←";
      }
      if (right) {
        right.disabled = (i === windows.length - 1);
        right.textContent = (cols === 1) ? "↓" : "→";
      }
    });

    var cells = gridEl.querySelectorAll(".cell");
    for (var j = 0; j < cells.length; j++) {
      var cid = Number(cells[j].id.replace("cell-", ""));
      var stillExists = windows.some(function (w) { return w.id === cid; });
      if (!stillExists) cells[j].remove();
    }
  }

  var HIDE_DELAY = 3000;
  function showTools(win) {
    var cell = document.getElementById("cell-" + win.id);
    if (!cell) return;
    var tools = cell.querySelector(".tools");
    if (!tools) return;
    tools.classList.add("show");
    if (win.hideTimer) { clearTimeout(win.hideTimer); win.hideTimer = null; }
    if (win.playing) {
      win.hideTimer = setTimeout(function () { hideTools(win); }, HIDE_DELAY);
    }
  }
  function hideTools(win) {
    win.hideTimer = null;
    var cell = document.getElementById("cell-" + win.id);
    if (!cell) return;
    var tools = cell.querySelector(".tools");
    if (tools) tools.classList.remove("show");
  }

  function buildCell(win) {
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.id = "cell-" + win.id;

    var mount = document.createElement("div");
    mount.className = "player";
    mount.id = win.mountId;
    cell.appendChild(mount);

    var tools = document.createElement("div");
    tools.className = "tools";
    tools.appendChild(toolBtn("left", "←", function () { move(win.id, -1); showTools(win); }));
    tools.appendChild(toolBtn("right", "→", function () { move(win.id, 1); showTools(win); }));
    tools.appendChild(toolBtn("del", "×", function () { removeWindow(win.id); }));
    cell.appendChild(tools);

    return cell;
  }

  function toolBtn(cls, label, onClick) {
    var b = document.createElement("button");
    b.className = "tool " + cls;
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      onClick();
    });
    return b;
  }

  document.getElementById("add").addEventListener("click", onAdd);
  urlEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") onAdd();
  });
  function onAdd() {
    var vid = parseVideoId(urlEl.value);
    if (!vid) {
      flashInvalid();
      return;
    }
    addWindow(vid);
    urlEl.value = "";
  }

  urlEl.addEventListener("input", function () {
    urlEl.classList.remove("invalid");
  });

  var segBtns = document.querySelectorAll(".seg");
  for (var k = 0; k < segBtns.length; k++) {
    segBtns[k].addEventListener("click", function () {
      setCols(Number(this.dataset.cols));
    });
  }

  if (window.addEventListener) {
    window.addEventListener("blur", function () {
      setTimeout(function () {
        var ae = document.activeElement;
        if (ae && ae.tagName === "IFRAME") {
          var win = windows.find(function (w) { return w.mountId === ae.id; });
          if (win) showTools(win);
          try { window.focus(); } catch (e) {}
        }
      }, 0);
    });
  }

  var MAX_WINDOWS = 12;
  var restoring = false;

  // Save the current state as URL params so that users can reload the page without losing the added videos.
  // Format: ?cols=<n>&v=<id>,<id>,...
  function saveState() {
    if (restoring) return;
    if (typeof history === "undefined" || !history.replaceState) return;
    var params = new URLSearchParams();
    params.set("cols", String(cols));
    if (windows.length) {
      params.set("v", windows.map(function (w) { return w.videoId; }).join(","));
    }
    var qs = params.toString();
    history.replaceState(null, "", qs ? ("?" + qs) : location.pathname);
  }

  function loadState() {
    if (typeof URLSearchParams === "undefined") return;
    var params = new URLSearchParams(location.search);

    restoring = true;

    var c = parseInt(params.get("cols"), 10);
    setCols(c === 2 || c === 3 ? c : 1);

    var raw = params.get("v");
    if (raw) {
      var ids = raw.split(",");
      var added = 0;
      for (var i = 0; i < ids.length && added < MAX_WINDOWS; i++) {
        if (isId(ids[i])) {
          addWindow(ids[i]);
          added++;
        }
      }
    }

    restoring = false;
    saveState();
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    pending.forEach(createPlayer);
    pending = [];
  };

  loadState();
})();
</script>
</body>
</html>
